name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python files
        run: python -m py_compile install_skill.py skill/scripts/project_workflow.py skill/scripts/blender_workflow.py skill/scripts/deliver_workflow.py tests/test_project_workflow.py tests/test_install_skill.py
      - name: Run isolated tests (no Blender or MCP service required)
        run: python -m unittest discover -s tests -v
